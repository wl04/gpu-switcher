# Tooling configuration only (ruff + mypy). This file is not used for
# packaging or installation: the Debian package is built from debian/ and
# tools/build-deb.sh, and the only runtime dependencies are Python 3 (>= 3.12)
# and PyGObject (GTK 4), which are not pip packages (see README "Install").
[project]
name = "gpu-switcher"
version = "0.3.1"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 88
target-version = "py312"
# Source root, so ruff treats gpu_switcher as first-party when sorting imports.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E402: gi.require_version() must run before the gi.repository imports.
# E501: line length is handled by the formatter.
# RUF012: read-only shared constant test data (a dict keyed by pid).
# UP031: %-formatting is used deliberately for gettext messages.
ignore = ["E402", "E501", "RUF012", "UP031"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = ["src"]
ignore_missing_imports = true
# Resolve modules as gpu_switcher.* (via mypy_path), not as top-level duplicates.
explicit_package_bases = true

# disallow_untyped_defs is enforced for the pure modules and the tests; the
# helper package and the GTK UI (main.py) are checked for type errors only.
[[tool.mypy.overrides]]
module = [
    "gpu_switcher.core.*",
    "gpu_switcher.cli",
    "gpu_switcher.decisions",
    "gpu_switcher.selection",
    "gpu_switcher.state",
    "gpu_switcher.detect",
    "test_bus",
    "test_cli",
    "test_connectors",
    "test_decisions",
    "test_detect",
    "test_helper",
    "test_helper_resilience",
    "test_i18n",
    "test_main",
    "test_rule_store",
    "test_selection",
    "test_state",
    "test_udev_rules",
]
disallow_untyped_defs = true

# Coverage floor for `make coverage` (and CI). Measured 79% in a plain shell, 91%
# with the window tests enabled (GPU_SWITCHER_GUI_TESTS=1 on a virtual display, as
# CI runs them): the floor tracks the lower number because that is what any
# contributor can run. The floor is a ratchet — raise it when coverage goes up,
# never lower it to turn a red build green. main.py is the GTK UI and counts
# against this number on purpose.
[tool.coverage.run]
source = ["src/gpu_switcher"]

[tool.coverage.report]
precision = 0
fail_under = 78
show_missing = true
