<!-- D-Bus security policy for the gpu-switcher helper.
     Installed to /usr/share/dbus-1/system.d/com.github.wl04.gpu_switcher.Helper.conf.

     The system bus denies owning well-known names by default
     (<deny own="*"/> in system.conf); this file punches the required holes:
     - only root may own the helper's name (dbus-daemon starts it as root),
     - any session user may call the helper's methods; the helper performs
       its own polkit authorization check before acting.
-->
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Only root may own the helper service name -->
  <policy user="root">
    <allow own="com.github.wl04.gpu_switcher.Helper"/>
  </policy>

  <!-- Any user may invoke the helper's methods; the helper authorizes
       each privileged operation via polkit before doing anything. -->
  <policy context="default">
    <allow send_destination="com.github.wl04.gpu_switcher.Helper"/>
  </policy>
</busconfig>
